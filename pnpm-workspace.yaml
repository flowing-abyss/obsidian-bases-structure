packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - obsidian-test-mocks@3.7.0
blockExoticSubdeps: true
saveExact: true
peerDependencyRules:
  # eslint-plugin-obsidianmd@0.4.1 pins its `obsidian` peer to the exact version that
  # was current when it was published — it only reads `obsidian`'s stable, long-lived
  # PluginManifest type shape, not runtime behavior, so a newer `obsidian` (which this
  # template intentionally tracks via "latest" for current API typings) is fine here.
  allowedVersions:
    'eslint-plugin-obsidianmd>obsidian': '*'

# NOT overriding brace-expansion (`pnpm audit` flags GHSA-mh99-v99m-4gvg via several
# minimatch@<10 chains in eslint's own resolution). Every minimatch below 10.x expects
# brace-expansion's old default-export shape; forcing the patched major (which only
# exports named bindings) breaks eslint outright. No compatible patched version exists
# for the old API shape. Not exploitable here: only matches this repo's own glob
# patterns, never attacker-controlled input. Tracked via Renovate; resolves once eslint
# moves to minimatch@10+.

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
